# Netlify settings for Olá Amigos — a fully static Next.js export.
#
# The build first creates audio for any word that doesn't have it yet, then
# builds the site. Existing (committed) audio is never regenerated, so when no
# words are new, the Azure key isn't even used.
#
# Set these in Netlify → Site configuration → Environment variables:
#   AZURE_SPEECH_KEY     (mark as secret; scope: Builds)
#   AZURE_SPEECH_REGION  e.g. uksouth
#   PT_VOICE, EN_VOICE   optional, see .env.example
# Never prefix them with NEXT_PUBLIC_ — that would publish the key in the website.
[build]
  command = "npm run audio && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Basic security headers. The site has no server and sends no data anywhere.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Audio and build assets never change once published, so browsers can keep them.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
